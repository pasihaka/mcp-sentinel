name = "mcp-sentinel"
main = "src/edge/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Scheduled synthetic checks every 1 minute
[triggers]
crons = ["* * * * *"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "mcp-sentinel-db"
database_id = "1f98a3e6-2e88-4f5a-81df-d4305ca0057f"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
